/* ---------- localStorage shim so the code below (written for Claude's
   window.storage API) works unchanged on a normal deployed website ---------- */
window.storage = {
  async get(key, shared) {
    const v = localStorage.getItem((shared ? "shared:" : "personal:") + key);
    if (v === null) throw new Error("not found");
    return { key, value: v, shared };
  },
  async set(key, value, shared) {
    localStorage.setItem((shared ? "shared:" : "personal:") + key, value);
    return { key, value, shared };
  },
  async delete(key, shared) {
    localStorage.removeItem((shared ? "shared:" : "personal:") + key);
    return { key, deleted: true, shared };
  },
  async list(prefix, shared) {
    const p = (shared ? "shared:" : "personal:") + (prefix || "");
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(p)) keys.push(k.slice((shared ? "shared:" : "personal:").length));
    }
    return { keys, prefix, shared };
  },
};

const CEFR_ORDER = ["A1","A2","B1","B2","C1","C2"];

const numToCefr = (n) => CEFR_ORDER[Math.max(0, Math.min(5, Math.round(n) - 1))];
const countToCefr = (count, total) => { const r = count / total; if (r >= 0.9) return "C1"; if (r >= 0.75) return "B2"; if (r >= 0.5) return "B1"; if (r >= 0.25) return "A2"; return "A1"; };
const countToIelts = (count, total) => { const r = count / total; if (r >= 0.9) return 8.5; if (r >= 0.75) return 7; if (r >= 0.5) return 6; if (r >= 0.25) return 5; return 4; };
const roundHalf = (n) => Math.round(n * 2) / 2;

/* ---------- Claude API helpers ---------- */

async function askClaudeJSON(userContent) {
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1800,
      messages: [{ role: "user", content: userContent }],
    }),
  });
  const data = await response.json();
  const text = (data.content || []).map((b) => (b.type === "text" ? b.text : "")).join("\n");
  const cleaned = text.replace(/```json|```/g, "").trim();
  return JSON.parse(cleaned);
}

async function evaluateOpenResponse({ skillLabel, task, response, track }) {
  const levelInstruction =
    track === "ielts"
      ? 'Use an IELTS band score for "level", formatted like "6.5".'
      : 'Use a CEFR level for "level", formatted like "B2".';
  const prompt = `You are a strict but fair English examiner grading a ${skillLabel} response for a language certificate exam.

Task given to the student:
"""${task}"""

Student's response:
"""${response}"""

${levelInstruction}
Respond ONLY with valid JSON, no markdown fences, no preamble, in exactly this shape:
{"level": "...", "errors": [{"original": "...", "correction": "...", "explanation": "..."}], "recommendations": ["...", "..."], "strengths": ["..."]}
Limit errors to at most 5 of the most important ones, and recommendations to at most 3. Write "explanation", "recommendations", and "strengths" text in Uzbek. Keep "original" and "correction" in English.`;
  try {
    return await askClaudeJSON(prompt);
  } catch (e) {
    return {
      level: track === "ielts" ? "5.5" : "B1",
      errors: [],
      recommendations: ["Natijani baholashda xatolik yuz berdi, qayta urinib ko'ring."],
      strengths: [],
    };
  }
}

async function generateFreshBundle(avoidTopics, track) {
  const prompt = `Create one fresh set of English exam materials for a language test, on a topic that is NOT any of these already-used topics: ${avoidTopics.join(", ") || "none"}.

Respond ONLY with valid JSON, no markdown fences, no preamble, in exactly this shape:
{
  "id": "short-slug",
  "topicLabel": "Uzbek label for the topic, 2-4 words",
  "reading": {
    "passage": "an original ~120-150 word English passage suitable for a B1-B2 reader",
    "questions": [
      {"q": "...", "options": ["...","...","...","..."], "correct": 0},
      {"q": "...", "options": ["...","...","...","..."], "correct": 0},
      {"q": "...", "options": ["...","...","...","..."], "correct": 0},
      {"q": "...", "options": ["...","...","...","..."], "correct": 0}
    ]
  },
  "listening": {
    "passage": "an original ~100-130 word English passage written to be read aloud (like announcements or spoken instructions), on a different everyday topic than the reading passage",
    "questions": [
      {"q": "...", "options": ["...","...","...","..."], "correct": 0},
      {"q": "...", "options": ["...","...","...","..."], "correct": 0},
      {"q": "...", "options": ["...","...","...","..."], "correct": 0},
      {"q": "...", "options": ["...","...","...","..."], "correct": 0}
    ]
  },
  "writingTask": {
    "cefr": "an Uzbek-language instruction for an informal letter task related to the topic, at least 120 words, informal style",
    "ielts": "an English instruction for an informal letter task related to the topic, at least 150 words, informal style"
  },
  "speakingTask": {
    "cefr": "an Uzbek-language instruction for a 45-second spoken task related to the topic",
    "ielts": "an English instruction for a 45-second spoken task related to the topic"
  }
}
"correct" must be the 0-based index of the correct option. Keep passages and questions in English; keep the Uzbek fields (topicLabel, writingTask.cefr, speakingTask.cefr) in Uzbek.`;
  return await askClaudeJSON(prompt);
}

/* ---------- Personal "used topics" storage helpers ---------- */

function userKey(user) {
  return `${(user.ism || "").trim()}_${(user.familiya || "").trim()}`.toLowerCase();
}

async function getUsedTopics(user) {
  try {
    const r = await window.storage.get(`used-topics:${userKey(user)}`, false);
    if (r && r.value) return JSON.parse(r.value);
    return [];
  } catch (e) {
    return [];
  }
}

async function addUsedTopic(user, topicId) {
  try {
    const current = await getUsedTopics(user);
    const updated = [...current, topicId];
    await window.storage.set(`used-topics:${userKey(user)}`, JSON.stringify(updated), false);
  } catch (e) {
    /* non-fatal */
  }
}

async function pickBundle(user, track) {
  const used = await getUsedTopics(user);
  const available = TOPIC_BUNDLES.filter((b) => !used.includes(b.id));
  let bundle;
  if (available.length > 0) {
    bundle = available[Math.floor(Math.random() * available.length)];
  } else {
    try {
      bundle = await generateFreshBundle(used, track);
      if (!bundle.id) bundle.id = `ai-${Date.now()}`;
    } catch (e) {
      // API failed — fall back to the least-recently-avoided static bundle
      bundle = TOPIC_BUNDLES[Math.floor(Math.random() * TOPIC_BUNDLES.length)];
    }
  }
  await addUsedTopic(user, bundle.id);
  return bundle;
}

  const [track, setTrack] = useState(null);
  const [user, setUser] = useState({ ism: "", familiya: "", jinsi: "", yil: "", oy: "" });
  const [content, setContent] = useState(null);
  const [loadingContent, setLoadingContent] = useState(false);
  const [retaking, setRetaking] = useState(false);

  const [readingAnswers, setReadingAnswers] = useState({});
  const [listeningAnswers, setListeningAnswers] = useState({});
  const [writingText, setWritingText] = useState("");
  const [speakingText, setSpeakingText] = useState("");
  const [writingResult, setWritingResult] = useState(null);
  const [speakingResult, setSpeakingResult] = useState(null);
  const [evaluating, setEvaluating] = useState(false);

  const [isRecording, setIsRecording] = useState(false);
  const [speechSupported, setSpeechSupported] = useState(true);
  const [micError, setMicError] = useState(null);
  const recognitionRef = useRef(null);

  const [leaderboard, setLeaderboard] = useState([]);
  const [saveError, setSaveError] = useState(false);
  const [ttsError, setTtsError] = useState(null);

  useEffect(() => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) setSpeechSupported(false);
  }, []);

  useEffect(() => {
    if (step === 6) loadLeaderboard();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [step]);

  async function loadLeaderboard() {
    try {
      const list = await window.storage.list("leaderboard:", true);
      if (!list || !list.keys) return;
      const entries = [];
      for (const key of list.keys.slice(-8)) {
        try {
          const r = await window.storage.get(key, true);
          if (r) entries.push(JSON.parse(r.value));
        } catch (e) { /* skip */ }
      }
      entries.sort((a, b) => (b.ts || 0) - (a.ts || 0));
      setLeaderboard(entries.slice(0, 6));
    } catch (e) { /* ignore */ }
  }

  async function startTest() {
    setLoadingContent(true);
    const bundle = await pickBundle(user, track);
    setContent(bundle);
    setLoadingContent(false);
    setStep(2);
  }

  function playListening() {
    if (!content) return;
    if (!window.speechSynthesis) {
      setTtsError("Bu qurilma/brauzer ovoz chiqarishni (Text-to-Speech) qo'llab-quvvatlamaydi.");
      return;
    }
    setTtsError(null);
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(content.listening.passage);
    u.lang = "en-US";
    u.rate = 0.95;
    let started = false;
    u.onstart = () => { started = true; };
    u.onerror = () => {
      setTtsError("Ovoz ijro etilmadi. Bu ko'pincha shu demo muhitida audio chiqishi bloklangani sababli bo'ladi — pastdan matnni o'qib, savollarga javob bering.");
    };
    try {
      window.speechSynthesis.speak(u);
    } catch (e) {
      setTtsError("Ovozni ishga tushirib bo'lmadi. Pastdan matnni o'qib, savollarga javob bering.");
      return;
    }
    setTimeout(() => {
      if (!started) {
        setTtsError("Ovoz eshitilmadimi? Bu demo muhitida audio ba'zan ishlamaydi — pastdan matnni o'qib, savollarga javob bering. Haqiqiy saytda bu odatiy brauzerda muammosiz ishlaydi.");
      }
    }, 1800);
  }

  function startRecording() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setSpeechSupported(false); return; }
    setMicError(null);
    const rec = new SR();
    rec.lang = "en-US";
    rec.continuous = true;
    rec.interimResults = true;
    let finalText = "";
    let gotAnyResult = false;
    rec.onresult = (event) => {
      gotAnyResult = true;
      let interim = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const t = event.results[i][0].transcript;
        if (event.results[i].isFinal) finalText += t + " ";
        else interim += t;
      }
      setSpeakingText((finalText + interim).trim());
    };
    rec.onerror = (event) => {
      setIsRecording(false);
      if (event.error === "not-allowed" || event.error === "service-not-allowed") {
        setMicError("Mikrofonga ruxsat berilmadi. Bu ko'pincha shu sahifa ichida (artifact muhitida) mikrofon ruxsati bloklangani sababli bo'ladi — pastdagi maydonga javobingizni yozib qo'yaverishingiz mumkin.");
        setSpeechSupported(false);
      } else if (event.error === "no-speech") {
        setMicError("Ovoz eshitilmadi. Qayta urinib ko'ring yoki javobingizni yozing.");
      } else if (event.error === "audio-capture") {
        setMicError("Mikrofon topilmadi. Qurilmangizda mikrofon borligini tekshiring yoki yozib javob bering.");
        setSpeechSupported(false);
      }
    };
    rec.onend = () => {
      setIsRecording(false);
      if (!gotAnyResult && !micError) {
        setMicError("Mikrofondan ovoz olinmadi. Brauzer sozlamalarida mikrofonga ruxsat berilganiga ishonch hosil qiling, yoki javobingizni yozing.");
      }
    };
    try {
      recognitionRef.current = rec;
      rec.start();
      setIsRecording(true);
    } catch (e) {
      setMicError("Mikrofonni ishga tushirib bo'lmadi. Javobingizni yozib qoldiring.");
      setSpeechSupported(false);
      setIsRecording(false);
    }
  }

  function stopRecording() {
    if (recognitionRef.current) recognitionRef.current.stop();
    setIsRecording(false);
  }

  async function handleWritingSubmit() {
    setEvaluating(true);
    const result = await evaluateOpenResponse({ skillLabel: "Writing", task: content.writingTask[track], response: writingText, track });
    setWritingResult(result);
    setEvaluating(false);
    setStep(5);
  }

  async function handleSpeakingSubmit() {
    setEvaluating(true);
    const result = await evaluateOpenResponse({ skillLabel: "Speaking (transcribed)", task: content.speakingTask[track], response: speakingText, track });
    setSpeakingResult(result);
    setEvaluating(false);
    await finishAndSave(result);
    setStep(6);
  }

  function readingCorrectCount() {
    return content.reading.questions.reduce((acc, q, i) => acc + (readingAnswers[i] === q.correct ? 1 : 0), 0);
  }
  function listeningCorrectCount() {
    return content.listening.questions.reduce((acc, q, i) => acc + (listeningAnswers[i] === q.correct ? 1 : 0), 0);
  }

  function computeOverall(writingLevel, speakingLevel) {
    const rCount = readingCorrectCount();
    const lCount = listeningCorrectCount();
    const rTotal = content.reading.questions.length;
    const lTotal = content.listening.questions.length;
    if (track === "cefr") {
      const rLevel = countToCefr(rCount, rTotal);
      const lLevel = countToCefr(lCount, lTotal);
      const wLevel = writingLevel || "B1";
      const sLevel = speakingLevel || "B1";
      const avg = (cefrToNum(rLevel) + cefrToNum(lLevel) + cefrToNum(wLevel) + cefrToNum(sLevel)) / 4;
      return { overall: numToCefr(avg), breakdown: [{ label: "Reading", value: rLevel }, { label: "Listening", value: lLevel }, { label: "Writing", value: wLevel }, { label: "Speaking", value: sLevel }] };
    } else {
      const rBand = countToIelts(rCount, rTotal);
      const lBand = countToIelts(lCount, lTotal);
      const wBand = parseFloat(writingLevel) || 5.5;
      const sBand = parseFloat(speakingLevel) || 5.5;
      const avg = roundHalf((rBand + lBand + wBand + sBand) / 4);
      return { overall: avg.toFixed(1), breakdown: [{ label: "Reading", value: rBand }, { label: "Listening", value: lBand }, { label: "Writing", value: wBand.toFixed(1) }, { label: "Speaking", value: sBand.toFixed(1) }] };
    }
  }

  async function finishAndSave(finalSpeakingResult) {
    try {
      const result = computeOverall(writingResult?.level, finalSpeakingResult?.level);
      const key = `leaderboard:${user.ism}_${user.familiya || ""}_${Date.now()}`;
      await window.storage.set(key, JSON.stringify({ name: `${user.ism} ${user.familiya || ""}`.trim(), level: result.overall, track, ts: Date.now() }), true);
      await window.storage.set(`result:${user.ism}_${user.familiya || ""}`, JSON.stringify({ user, track, result, ts: Date.now() }), false);
    } catch (e) {
      setSaveError(true);
    }
  }

  async function handleRetake() {
    setRetaking(true);
    setReadingAnswers({});
    setListeningAnswers({});
    setWritingText("");
    setSpeakingText("");
    setWritingResult(null);
    setSpeakingResult(null);
    setMicError(null);
    setSaveError(false);
    const bundle = await pickBundle(user, track);
    setContent(bundle);
    setRetaking(false);
    setStep(2);
  }

  return (
    <div className="min-h-screen w-full py-10 px-4" style={{ background: `linear-gradient(180deg, ${COLORS.navy}, ${COLORS.navyLight})` }}>
      <div
        style={{
          position: "fixed",
          bottom: 10,
          right: 10,
          zIndex: 50,
          background: COLORS.gold,
          color: COLORS.navy,
          fontFamily: SERIF,
          fontSize: "0.7rem",
          padding: "4px 10px",
          borderRadius: 999,
          boxShadow: "0 2px 8px rgba(0,0,0,0.35)",
          letterSpacing: "0.02em",
        }}
      >
        by Ulug'bekov Ilyosbek
      </div>
      {step >= 1 && step <= 6 && <StepDots steps={STEP_LABELS} current={step - 1} />}

      {step === 0 && <Landing track={track} setTrack={setTrack} onNext={() => setStep(1)} />}

      {step === 1 && !loadingContent && <Registration user={user} setUser={setUser} onNext={startTest} />}
      {step === 1 && loadingContent && <LoadingCard message="Sizga mos mavzu tayyorlanmoqda..." />}

      {step === 2 && content && <ReadingScreen content={content} answers={readingAnswers} setAnswers={setReadingAnswers} onNext={() => setStep(3)} />}

      {step === 3 && content && <ListeningScreen content={content} answers={listeningAnswers} setAnswers={setListeningAnswers} onPlay={playListening} ttsError={ttsError} onNext={() => setStep(4)} />}

      {step === 4 && content && <WritingScreen track={track} content={content} text={writingText} setText={setWritingText} evaluating={evaluating} onSubmit={handleWritingSubmit} />}

      {step === 5 && content && (
        <SpeakingScreen
          track={track}
          content={content}
          speechSupported={speechSupported}
          isRecording={isRecording}
          onStartRecording={startRecording}
          onStopRecording={stopRecording}
          micError={micError}
          text={speakingText}
          setText={setSpeakingText}
          evaluating={evaluating}
          onSubmit={handleSpeakingSubmit}
        />
      )}

      {step === 6 && content && (
        <ResultScreen
          user={user}
          track={track}
          result={computeOverall(writingResult?.level, speakingResult?.level)}
          writingResult={writingResult}
          speakingResult={speakingResult}
          leaderboard={leaderboard}
          saveError={saveError}
          onRetake={handleRetake}
          retaking={retaking}
        />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<DarajaUz />);
</script>
</body>
</html>
